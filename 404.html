<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — PepeVault</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="https://media.pepevault.lol/pepevault-logo.svg">
<style>
  :root {
    --pv-green: #83b437;
    --pv-green-bright: #9DC74A;
    --pv-black: #0E0F0C;
    --pv-ink: #161812;
    --pv-cream: #F5EFE0;
    --pv-paper: #FAF5E8;
    --pv-terra: #C2622C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--pv-black);
    color: var(--pv-cream);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  main {
    max-width: 560px;
    width: 100%;
  }
  img.logo {
    width: 96px;
    height: 96px;
    margin-bottom: 2rem;
    filter: drop-shadow(0 4px 16px rgba(131, 180, 55, 0.45));
  }
  h1 {
    font-size: clamp(3.5rem, 12vw, 6rem);
    color: var(--pv-green-bright);
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
    font-weight: 800;
  }
  p.tag {
    font-size: 1.1rem;
    color: var(--pv-cream);
    opacity: 0.85;
    margin-bottom: 0.5rem;
    line-height: 1.4;
  }
  p.frog {
    font-size: 2.5rem;
    margin: 1rem 0 2rem;
  }
  a.back-home {
    display: inline-block;
    background: var(--pv-green);
    color: var(--pv-black);
    padding: 0.9rem 2rem;
    font-weight: 700;
    text-decoration: none;
    border-radius: 8px;
    letter-spacing: 0.04em;
    transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  a.back-home:hover {
    background: var(--pv-green-bright);
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(131, 180, 55, 0.45);
  }
  p.fineprint {
    margin-top: 3rem;
    font-size: 0.85rem;
    color: var(--pv-cream);
    opacity: 0.55;
  }
  p.fineprint a {
    color: var(--pv-green-bright);
    text-decoration: none;
  }
  p.fineprint a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <img class="logo" src="https://media.pepevault.lol/pepevault-logo.svg" alt="PepeVault">
  <h1>404</h1>
  <p class="tag">This page doesn't exist in the Vault.</p>
  <p class="frog">🐸</p>
  <a class="back-home" href="/">← Return to PepeVault</a>
  <p class="fineprint">Looking for the <a href="/live">live page</a> or <a href="/press">press kit</a>?</p>
</main>
</body>
</html>
